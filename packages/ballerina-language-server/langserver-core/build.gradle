apply from: "$rootDir/gradle/javaProject.gradle"
apply plugin: "com.gradleup.shadow"
apply plugin: "java"

configurations.all {
    resolutionStrategy.preferProjectModules()
}

configurations {
    balTools
    dist {
        transitive true
    }
}

dependencies {
    implementation project(":langserver-commons")

    implementation "org.ballerinalang:ballerina-lang:${ballerinaLangVersion}"
    implementation "org.ballerinalang:ballerina-parser:${ballerinaLangVersion}"
    implementation "org.ballerinalang:ballerina-tools-api:${ballerinaLangVersion}"
    implementation "org.ballerinalang:ballerina-runtime:${ballerinaLangVersion}"
    implementation "org.ballerinalang:central-client:${ballerinaLangVersion}"
    implementation "org.ballerinalang:diagram-util:${ballerinaLangVersion}"
    implementation "org.ballerinalang:syntax-api-calls-gen:${ballerinaLangVersion}"
    implementation "org.ballerinalang:formatter-core:${ballerinaLangVersion}"
    implementation "org.ballerinalang:toml-parser:${ballerinaLangVersion}"

    implementation "org.eclipse.lsp4j:org.eclipse.lsp4j:${eclipseLsp4jVersion}"
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonDatabindVersion}"
    implementation "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml:${jacksonDataformatYamlVersion}"
    implementation "io.netty:netty-buffer:${nettyBufferVersion}"
    implementation "org.slf4j:slf4j-jdk14:${slf4jJdk14Version}"
    implementation "com.google.code.findbugs:jsr305:${findbugsJsr305Version}"
    implementation "org.apache.commons:commons-lang3:${apacheCommonsLang3Version}"
    implementation "commons-io:commons-io:${commonsIoVersion}"
    implementation "com.google.guava:guava:${guavaVersion}"
    implementation "com.moandjiezana.toml:toml4j:${moandjiezanaToml4jVersion}"

    testImplementation "org.testng:testng:${testngVersion}"
    testImplementation "org.mockito:mockito-core:${mockitoVersion}"
    testImplementation "org.awaitility:awaitility:${awaitilityVersion}"
}

ext.moduleName = 'io.ballerina.language-server-commons.extension'
jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    dependsOn configurations.dist
    from { configurations.dist.collect { it.isDirectory() ? it : zipTree(it) } } {
        exclude 'META-INF/*.RSA', 'META-INF/*.SF', 'META-INF/*.DSA'
    }
}

tasks.register('copyRuntime') {
    dependsOn configurations.dist
    doFirst {
        configurations.dist.each { artifact ->
            copy {
                from artifact.getPath()
                into "$buildDir/bre/lib"
            }
        }
    }
}

rootProject.configureBallerinaDistribution(project)

// FastRunCompilerPluginTest imports lstest/fastrun_marker (a test compiler plugin) from a local repository. It runs in
// a task of its own with a Ballerina home that holds only that package, so no other suite can see it.
def fastRunPluginHome = file("$buildDir/fastrun-plugin-home")

tasks.register('installFastRunMarker') {
    dependsOn ':langserver-stdlib:build'
    doLast {
        delete fastRunPluginHome
        fileTree("${rootProject.project(':langserver-stdlib').buildDir}/ballerina-marker-src/target/bala")
                .include('*.bala').each { bala ->
            // <org>-<name>-<platform>-<version>.bala
            def parts = bala.name.replace('.bala', '').split('-')
            copy {
                from zipTree(bala)
                into new File(fastRunPluginHome,
                        "repositories/local/bala/${parts[0]}/${parts[1]}/${parts[-1]}/${parts[-2]}")
            }
        }
    }
}

tasks.register('fastRunPluginTest', Test) {
    description = 'Runs the fast-run compiler plugin tests against their own Ballerina home'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    dependsOn copyRuntime
    dependsOn unpackJballerinaTools
    dependsOn buildAndCopyLangserverStdlib
    dependsOn installFastRunMarker
    systemProperty "ballerina.home", file("$buildDir/jballerina-tools-${ballerinaLangVersion}")
    systemProperty "org.apache.commons.logging.Log", "org.apache.commons.logging.impl.NoOpLog"
    testLogging {
        showStackTraces = true
        events "failed"
        exceptionFormat "full"
    }
    jacoco {
        enabled = true
        destinationFile = file("$buildDir/coverage-reports/jacoco-fastrun.exec")
        includeNoLocationClasses = true
        excludes = ['jdk.internal.*']
    }
    useTestNG()
    filter {
        includeTestsMatching 'org.ballerinalang.langserver.fastrun.*'
    }
    // Set at execution time so it wins over the shared home every Test task is configured with.
    doFirst {
        environment "BALLERINA_HOME_DIR", fastRunPluginHome.absolutePath
    }
}

test {
    dependsOn copyRuntime
    // A failing plugin test must not stop the main suite; it runs right after and still fails the build.
    finalizedBy fastRunPluginTest

    useTestNG() {
        suites "src/test/resources/testng.xml"
    }
}

compileJava {
    doFirst {
        options.compilerArgs = [
                '--module-path', classpath.asPath,
        ]
        classpath = files()
    }
}

