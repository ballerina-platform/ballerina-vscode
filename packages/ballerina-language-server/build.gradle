// Build-owned Ballerina user home. Both bal build (below) and every test JVM use
// this directory instead of ~/.ballerina, so test runs never read from or write
// to the developer's machine-wide package cache. It lives inside the task's
// output directory on purpose: wiping build/ballerina_dependencies clears the
// resolution hash and the cache it describes together, so they cannot go out of
// sync.
ext.ballerinaTestHomeDir = file("$buildDir/ballerina_dependencies/home")

task resolveBallerinaDependencies {
    description 'Resolves Ballerina dependencies by executing bal build in build-config/ballerina_dependencies'
    group 'build'

    def sourceDir = file("build-config/ballerina_dependencies")
    def targetDir = file("$buildDir/ballerina_dependencies")

    inputs.dir sourceDir
    outputs.dir targetDir

    doLast {
        def lockFile = file("build-config/ballerina_dependencies/Dependencies.toml")
        def hashFile = file("$buildDir/ballerina_dependencies/.deps-hash")

        def digest = java.security.MessageDigest.getInstance("SHA-256")
        digest.update(lockFile.bytes)
        def currentHash = digest.digest().collect { String.format("%02x", it) }.join()

        // Skip the bal build only when the locked dependency set is unchanged AND the
        // home it describes still exists — a partially deleted home must trigger
        // re-resolution. Dependencies.toml is the authoritative lock (every resolved
        // package and exact version, transitives included), so it is the correct change
        // signal; Ballerina.toml only declares version floors and does not by itself
        // determine what gets provisioned into the cache.
        def homeBalaDir = new File(ballerinaTestHomeDir, "repositories/central.ballerina.io/bala")
        def skipResolution = hashFile.exists() && hashFile.text.trim() == currentHash && homeBalaDir.exists()

        if (skipResolution) {
            logger.lifecycle("Dependencies.toml unchanged — skipping dependency resolution")
        } else {
            delete targetDir

            // Copy the directory to build location
            copy {
                from sourceDir
                into targetDir
            }

            // Execute bal build in the copied directory
            def errOutput = new ByteArrayOutputStream()
            def result = exec {
                ignoreExitValue = true
                workingDir targetDir
                environment "BALLERINA_HOME_DIR", ballerinaTestHomeDir.absolutePath

                def balBuildCommand = "bal build --sticky"
                if (org.gradle.internal.os.OperatingSystem.current().isWindows()) {
                    commandLine 'cmd', '/c', balBuildCommand
                } else {
                    commandLine '/bin/sh', '-c', balBuildCommand
                }
                errorOutput = errOutput
            }

            if (result.exitValue != 0) {
                println errOutput
                throw new GradleException("Failed to build Ballerina dependencies")
            }

            hashFile.text = currentHash
        }
    }
}

// Building a custom Ballerina distribution for testing
ext.configureBallerinaDistribution = { Project targetProject ->
    targetProject.with {
        def balDistribution = file("$targetProject.buildDir/jballerina-tools-${ballerinaLangVersion}")

        tasks.register('unpackJballerinaTools') {
            project.configurations.each { configuration ->
                if (configuration.name == "externalJars") {
                    dependsOn(project.copyToLib)
                }
            }

            doLast {
                project.configurations.jbalTools.resolvedConfiguration.resolvedArtifacts.each { artifact ->
                    project.copy {
                        from project.zipTree(artifact.getFile())
                        into new File("${project.buildDir}/")
                    }
                }
            }
        }

        tasks.register('buildAndCopyLangserverStdlib') {
            dependsOn ':langserver-stdlib:build'

            doLast {
                // Get all .bala files from the source directory
                fileTree("${rootProject.project(':langserver-stdlib').buildDir}/ballerina-src/target/bala").include("**/*.bala").each { balaFile ->
                    // Parse the bala filename to extract organization, package, jdk, and version
                    // Format: <org>-<package>-<jdk>-<version>.bala
                    def fileName = balaFile.name.replace('.bala', '')
                    def parts = fileName.split('-')

                    if (parts.length >= 4) {
                        def org = parts[0]
                        def version = parts[parts.length - 1]
                        def jdk = parts[parts.length - 2]
                        // Package name could be multiple parts joined with hyphens
                        def packageParts = parts[1..(parts.length - 3)]
                        def packageName = packageParts.join('-')

                        // Create directory structure: <org>/<package>/<version>/<jdk>
                        def targetDir = "${project.buildDir}/jballerina-tools-${project.ballerinaLangVersion}/repo/bala/${org}/${packageName}/${version}/${jdk}"

                        // Extract the .bala file to the destination directory
                        // .bala files are ZIP archives, so we can use zipTree to extract them
                        copy {
                            from zipTree(balaFile)
                            into targetDir
                        }

                        println "Extracted ${balaFile.name} to ${targetDir}"
                    } else {
                        println "Warning: Bala file ${balaFile.name} does not match the expected format <org>-<package>-<jdk>-<version>.bala"
                    }
                }
            }
        }

        // Configure test task to use the common dependencies and system properties
        test {
            dependsOn unpackJballerinaTools
            dependsOn buildAndCopyLangserverStdlib
            systemProperty "ballerina.home", balDistribution
            systemProperty "responseTimeThreshold", 2000
        }
    }
}

