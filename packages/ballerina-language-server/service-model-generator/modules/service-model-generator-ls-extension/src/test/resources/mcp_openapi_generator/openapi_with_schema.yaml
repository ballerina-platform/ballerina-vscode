openapi: 3.0.0
info:
  title: Petstore
  version: 1.0.0
servers:
  - url: http://petstore.example.com
paths:
  /pets:
    get:
      operationId: getPets
      summary: Returns a Product list from the store
      responses:
        '200':
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
components:
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
