name: "Build Ballerina VSIX"
# Composite-action inputs only support description / required / default. The
# 'type:' key is silently ignored by the Actions runtime — drop it. All input
# values are passed as strings.
inputs:
  isPreRelease:
    description: Whether this is a prerelease build
    required: false
    default: 'true'
  nightly:
    description: >-
      Nightly build: stamp the timestamped version derived from the extension
      package.json's '-SNAPSHOT' version (major.(minor-1).<minutes since 2020-01-01 UTC>).
      Selects the version only; 'vsce package --pre-release' follows
      isPreRelease, which a nightly also passes.
    required: false
    default: 'false'
  enableCache:
    description: Enable rush/pnpm install caches
    required: false
    default: 'true'
  ballerina:
    description: Update Ballerina extension version
    required: false
    default: 'false'
  version:
    description: Explicit version override, or N/A to derive it from the extension package.json
    required: false
    default: 'N/A'
  COPILOT_ROOT_URL:
    required: false
  COPILOT_DEV_ROOT_URL:
    required: false
  APPINSIGHTS_INSTRUMENTATION_KEY:
    required: false

outputs:
  ballerinaVersion:
    description: The Ballerina distribution version used by the build
    value: ${{ steps.ballerina.outputs.version }}

runs:
  using: "composite"
  steps:
    - name: Setup Rush
      uses: gigara/setup-rush@7ba3446572d15f5eacc85de383ad9679dfb7223c # v1.2.0
      with:
        pnpm: 10.11.0
        node: 22.x
        cache-rush: ${{ inputs.enableCache }}
        cache-pnpm: ${{ inputs.enableCache }}
        set-env: ${{ inputs.enableCache }}

    # JDK + Gradle for the ballerina-language-server subproject. rush invokes
    # './gradlew build pack -x test -x check' as part of the LS package's
    # build script, so these must be present before 'rush build' runs.
    - name: Set up JDK 21
      uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
      with:
        distribution: 'temurin'
        java-version: 21.0.3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

    - name: Install Ballerina
      id: ballerina
      uses: ./.github/actions/setup-ballerina

    - name: Validate build mode
      if: ${{ inputs.nightly == 'true' && inputs.isPreRelease != 'true' }}
      shell: bash
      run: |
        echo "::error::A nightly build must set isPreRelease=true so its VSIX is packaged with --pre-release."
        exit 1

    - name: Cache Ballerina dependencies (LS gradle)
      if: ${{ inputs.enableCache == 'true' }}
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.ballerina/repositories/
        key: ${{ runner.os }}-ballerina-${{ github.base_ref || github.ref_name }}-${{ hashFiles('packages/ballerina-language-server/**/gradle.properties') }}
        restore-keys: |
          ${{ runner.os }}-ballerina-${{ github.base_ref || github.ref_name }}-

    - name: Update version - Ballerina
      if: ${{ inputs.ballerina == 'true' }}
      uses: ./.github/actions/updateVersion
      with:
        isPreRelease: ${{ inputs.isPreRelease }}
        nightly: ${{ inputs.nightly }}
        version: ${{ inputs.version }}

    - name: Copy .env.example to .env
      shell: bash
      run: |
        find . -path ./submodules -prune -o -type f -name ".env.example" -print | while read example; do
          envfile="$(dirname "$example")/.env"
          cp "$example" "$envfile"
        done

    - name: Build repo
      shell: bash
      id: build
      run: |
        # Quick sanity log so missing-credential failures point at the right cause.
        echo "::group::LS credential check"
        echo "packageUser: ${packageUser:+<set>}${packageUser:-<empty>}"
        echo "packagePAT:  ${packagePAT:+<set, length=${#packagePAT}>}${packagePAT:-<empty>}"
        echo "::endgroup::"
        node common/scripts/install-run-rush.js build --to ballerina --verbose
      env:
        # Consumed by common-libs/scripts/package-vsix.js, which turns it into
        # 'vsce package --pre-release'. The bundled language server is always the one
        # built from source in this repo, at the version in gradle.properties, so
        # nothing here selects an LS.
        isPreRelease: ${{ inputs.isPreRelease == 'true' }}
        # Credentials for the LS gradle build (maven.pkg.github.com/ballerina-platform/*)
        packageUser: ${{ github.actor }}
        packagePAT: ${{ github.token }}
        COPILOT_ROOT_URL: ${{ inputs.COPILOT_ROOT_URL }}
        COPILOT_DEV_ROOT_URL: ${{ inputs.COPILOT_DEV_ROOT_URL }}
        APPINSIGHTS_INSTRUMENTATION_KEY: ${{ inputs.APPINSIGHTS_INSTRUMENTATION_KEY }}

    # Guards the federated BI project form consumed by the WSO2 Integrator webview.
    # A missing remote is invisible until runtime, so fail here rather than upload a
    # VSIX that cannot federate. See packages/ballerina-extension/scripts/copy-federation.js.
    - name: Verify federation assets in the VSIX
      shell: bash
      run: |
        set -euo pipefail
        version=$(node -p "require('./packages/ballerina-extension/package.json').version")
        vsix="packages/ballerina-extension/vsix/ballerina-${version}.vsix"
        entry='extension/resources/jslibs/federation/remoteEntry.js'
        # 'zip' and 'unzip' are separate packages, so the sibling Compress build step
        # using zip does not imply unzip is here. Say so plainly rather than surfacing
        # a bare 'unzip: command not found' against a step about federation.
        if ! command -v unzip >/dev/null 2>&1; then
          echo "::error::unzip is not installed on this runner, so ${vsix} cannot be verified."
          exit 1
        fi
        # Listed once into a variable: piping unzip into 'grep -q' lets grep exit on the
        # first match, and the resulting SIGPIPE fails the pipeline under pipefail.
        listing=$(unzip -Z1 "$vsix")
        if ! grep -Fxq "$entry" <<<"$listing"; then
          echo "::error::${vsix} is missing ${entry}; the BI project form cannot be federated."
          grep -F 'resources/jslibs/federation' <<<"$listing" || echo "No federation files at all."
          exit 1
        fi
        count=$(grep -cF 'extension/resources/jslibs/federation/' <<<"$listing")
        echo "Federation assets present in ${vsix}: ${count} file(s)."

    - name: Compress build
      shell: bash
      run: |
        # Resolve the exact VSIX from packages/ballerina-extension/vsix/. The 'vsix/'
        # subdir (populated by the copyVSIX script) is one of the rush build-cache
        # outputFolderNames, so it's present even when ballerina is restored from
        # cache. The package-root 'ballerina-<version>.vsix' (vsce's direct output)
        # is NOT cached and may be missing on cache-restore.
        #
        # Read the version from the extension manifest — the single source of truth
        # and the file vsce used to name the VSIX.
        version=$(node -p "require('./packages/ballerina-extension/package.json').version")
        # Stage the VSIX at the workspace root so consumers that unzip build.zip
        # (release-pre-release.yml and notifications) resolve 'ballerina-<v>.vsix'
        # with a root-level `ls`. Must happen before build.zip is created.
        cp "packages/ballerina-extension/vsix/ballerina-${version}.vsix" ./
        zip -rq build.zip ./ -x 'common/temp*' -x '**/node_modules/*' -x 'submodules/wso2-vscode-extensions/.git/*'
        zip -j VSIX.zip "packages/ballerina-extension/vsix/ballerina-${version}.vsix"

    - name: Save build
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        path: build.zip
        name: ExtBuild
        retention-days: 1

    - name: Save VSIX
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        path: VSIX.zip
        name: VSIX
        retention-days: 30
