name: Daily Build

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Ballerina language server — multi-branch pack & test
  # ─────────────────────────────────────────────────────────────────────────
  ls-prepare-matrix:
    name: LS prepare matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    outputs:
      targets: ${{ steps.resolve-targets.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve target branches
        id: resolve-targets
        shell: bash
        run: |
          set -euo pipefail

          latest_branch=$(git ls-remote --heads origin | awk -F'/' '/refs\/heads\/1\.[0-9]+\.x$/ { print $NF }' | sort -V | tail -n 1)
          if [ -z "${latest_branch}" ]; then
            echo "No 1.x.x release branch found on origin; building from main only." >&2
          fi

          timestamp=$(date '+%Y%m%d-%H%M%S')
          targets='[]'

          branches="main"
          if [ -n "${latest_branch}" ]; then
            branches="main ${latest_branch}"
          fi

          for branch in ${branches}; do
            git fetch --depth=1 origin "${branch}:refs/remotes/origin/${branch}"

            branch_version=$(git show "origin/${branch}:packages/ballerina-language-server/gradle.properties" | awk -F= '$1 == "version" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); gsub(/\r/, "", $2); print $2; exit }')
            if [ -z "${branch_version}" ]; then
              echo "Unable to resolve version from gradle.properties for ${branch}" >&2
              exit 1
            fi

            build_version="${branch_version}-${timestamp}"
            targets=$(jq -c \
              --arg branch "${branch}" \
              --arg version "${build_version}" \
              '. + [{branch: $branch, version: $version}]' <<< "${targets}")
          done

          echo "targets=${targets}" >> "${GITHUB_OUTPUT}"

  ls-ubuntu-pack:
    name: LS Ubuntu pack (${{ matrix.branch }})
    needs: ls-prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ls-ubuntu-pack-${{ matrix.branch }}-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@97fd67111e3c3ecdfafff96fc24d95ad909ab299 # v1.1.4
        with:
          version: 2201.13.4

      # No dependency cache here: this job runs `pack -x check` (no tests), so it never provisions
      # build/ballerina_dependencies. Nothing to cache.

      - name: Pack with Gradle
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew -Pversion=${{ matrix.version }} pack -x check

      - name: Upload daily build jar
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          path: packages/ballerina-language-server/build/ballerina-language-server-${{ matrix.version }}.jar
          if-no-files-found: error

  ls-ubuntu-test:
    name: LS Ubuntu test (${{ matrix.branch }})
    needs:
      - ls-prepare-matrix
      - ls-ubuntu-pack
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: ls-ubuntu-test-${{ matrix.branch }}-${{ github.ref_name }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      # Resolved from the matrix.branch checkout — the action file must
      # also exist on release branches in the matrix.
      - name: Run LS tests
        uses: ./.github/actions/ls-test
        with:
          cache-branch: ${{ matrix.branch }}
          gradle-version: ${{ matrix.version }}
          package-user: ${{ github.actor }}
          package-pat: ${{ secrets.GITHUB_TOKEN }}

  ls-windows-build:
    name: LS Windows build (${{ matrix.branch }})
    needs: ls-prepare-matrix
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: ls-windows-build-${{ matrix.branch }}-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    steps:
      - name: Enable long paths for Git
        shell: bash
        # Override the job default working-directory — it does not exist before checkout.
        working-directory: ${{ github.workspace }}
        run: git config --system core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Set Up Ballerina
        uses: ballerina-platform/setup-ballerina@97fd67111e3c3ecdfafff96fc24d95ad909ab299 # v1.1.4
        with:
          version: 2201.13.4

      - name: Cache Ballerina dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/ballerina-language-server/build/ballerina_dependencies
          key: ${{ runner.os }}-ballerina-${{ matrix.branch }}-${{ hashFiles('packages/ballerina-language-server/build-config/ballerina_dependencies/**') }}

      - name: Build with Gradle
        shell: cmd
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew.bat -Pversion=${{ matrix.version }} build

  # ─────────────────────────────────────────────────────────────────────────
  # Language server — Trivy vulnerability scan
  # ─────────────────────────────────────────────────────────────────────────
  ls-trivy:
    name: LS Trivy scan (${{ matrix.branch }})
    needs: ls-prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.ls-prepare-matrix.outputs.targets) }}
    defaults:
      run:
        working-directory: packages/ballerina-language-server
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: 'temurin'
          java-version: 21.0.3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Generate SBOM
        env:
          packageUser: ${{ github.actor }}
          packagePAT: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew cyclonedxBom

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          scan-type: 'sbom'
          scan-ref: 'packages/ballerina-language-server/build/sbom.json'
          format: 'table'
          timeout: '10m0s'
          exit-code: '1'
          trivyignores: packages/ballerina-language-server/.trivyignore

  # ─────────────────────────────────────────────────────────────────────────
  # Ballerina VSCode extension — build VSIX + tests
  # ─────────────────────────────────────────────────────────────────────────
  Build:
    name: Extension build
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ballerina: true
      runFastTests: true
      runBalE2ETests: true
      # Daily builds ship only to a rolling GitHub `nightly` release, never the
      # Marketplace, so instead of the isPreRelease timestamp suffix they get a
      # '-SNAPSHOT' version (5.13.0-SNAPSHOT). It is valid semver so vsce
      # accepts it, and it makes a nightly VSIX unmistakable next to a release
      # build of the same version.
      #
      # isPreRelease: false is deliberate and does more than drop the timestamp.
      # It is also exported into the rush build env (actions/build/action.yml),
      # where common-libs/scripts/package-vsix.js turns it into
      # 'vsce package --pre-release'. Nightlies are therefore packaged WITHOUT
      # that flag, on purpose: the flag marks the VSIX as a pre-release build,
      # which moves whoever installs it onto the Marketplace pre-release channel
      # for future updates. A nightly is unvetted main, not an opt-in supported
      # channel, so it should not silently enroll testers in one.
      #
      # The bundled LS is built from source (lsSource defaults to 'local'), so
      # it always matches the extension version, and isPreRelease has no effect
      # on LS resolution here (that path is gated on lsSource == 'download').
      isPreRelease: false
      snapshot: true

  # ─────────────────────────────────────────────────────────────────────────
  # Daily pre-release — publish the extension VSIX as a GitHub pre-release
  # Gated on all verification jobs, including the LS Trivy scan, so a
  # dependency-scan failure blocks the daily pre-release.
  # ─────────────────────────────────────────────────────────────────────────
  Release:
    name: Publish daily pre-release
    needs:
      - ls-ubuntu-pack
      - ls-ubuntu-test
      - ls-windows-build
      - ls-trivy
      - Build
    if: ${{ github.repository == 'ballerina-platform/ballerina-vscode' }}
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # build.zip carries the full workspace (incl. .github/actions and the
      # built VSIX), so the local release action resolves without a checkout.
      - name: Restore build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExtBuild
          path: ./

      - name: Set up workspace
        run: |
          unzip build.zip
          rm build.zip

      - name: Publish pre-release
        uses: ./.github/actions/release
        with:
          repo: ${{ github.repository }}
          name: ballerina
          chatAPI: ${{ secrets.BI_TEAM_CHAT_API }}
          # Rolling tag: each daily run deletes and recreates the `nightly`
          # release so it always points at the latest build.
          tag: nightly

  # ─────────────────────────────────────────────────────────────────────────
  # Notifications
  # ─────────────────────────────────────────────────────────────────────────
  NotifySuccess:
    name: Notify (success)
    needs:
      - ls-ubuntu-pack
      - ls-ubuntu-test
      - ls-windows-build
      - ls-trivy
      - Build
    runs-on: ubuntu-latest
    steps:
      - name: Restore build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ExtBuild
          path: ./

      - name: Set up workspace
        run: |
          unzip build.zip
          rm build.zip

      - name: Notification - Ballerina
        uses: ./.github/actions/dailyBuildNotification
        with:
          title: Ballerina
          fileName: ballerina
          chatAPI: ${{ secrets.BI_TEAM_CHAT_API }}

  NotifyFailure:
    name: Notify (failure)
    needs:
      - ls-ubuntu-pack
      - ls-ubuntu-test
      - ls-windows-build
      - ls-trivy
      - Build
    if: ${{ always() && contains(needs.*.result, 'failure') && github.repository == 'ballerina-platform/ballerina-vscode' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: "Failure Notification"
        uses: ./.github/actions/failure-notification
        with:
          title: "Daily Build Failed"
          run_id: ${{ github.run_id }}
          chat_api: ${{ secrets.EDITOR_TEAM_CHAT_API }}
          repository: ${{ github.repository }}
